<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>24h Activity Log</title>
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#f5f6f8;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#111827;
  --danger:#dc2626;
  --ok:#15803d;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input{
  font:inherit;
}

.app{
  max-width:560px;
  margin:auto;
  min-height:100vh;
  padding-bottom:82px;
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(245,246,248,.94);
  backdrop-filter:blur(12px);
  padding:14px 16px 10px;
}

.title{
  font-size:20px;
  font-weight:750;
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.datebar{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.datebar button,
.iconbtn{
  border:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  height:40px;
  padding:0 13px;
  font-size:18px;
}

.datebar input{
  flex:1;
  height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--card);
  padding:0 10px;
  font-size:16px;
}

main{
  padding:8px 14px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin:10px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.03);
}

.switch{
  display:flex;
  background:#eef0f3;
  padding:3px;
  border-radius:12px;
}

.switch button{
  flex:1;
  border:0;
  border-radius:9px;
  height:38px;
  background:transparent;
  font-weight:650;
  color:var(--muted);
}

.switch button.active{
  background:white;
  color:var(--text);
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  margin-bottom:8px;
}

.pill{
  padding:5px 9px;
  border-radius:999px;
  background:#eef0f3;
}

.pill.ok{
  background:#dcfce7;
  color:#166534;
}

.pill.warn{
  background:#fee2e2;
  color:#991b1b;
}

/* =========================
   時計
   ========================= */

.clockwrap{
  display:flex;
  justify-content:center;
  padding:8px 0;
}

.clock{
  width:min(88vw,360px);
  aspect-ratio:1;
  position:relative;
  user-select:none;
}

.clock svg{
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}

.clock text{
  font-size:12px;
  fill:#6b7280;
}

.clock .center{
  fill:#fff;
  stroke:#e5e7eb;
}

.hint{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

/* =========================
   カテゴリ凡例
   ========================= */

.legend{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px 10px;
  margin:6px 4px 2px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  color:#4b5563;
  white-space:nowrap;
}

.legend-color{
  width:10px;
  height:10px;
  border-radius:50%;
  flex:none;
}

/* =========================
   時間設定
   ========================= */

.time-editor{
  margin-top:14px;
  padding:14px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:16px;
}

.time-editor-title{
  font-size:15px;
  font-weight:750;
  margin-bottom:12px;
}

.time-row{
  display:grid;
  grid-template-columns:1fr 28px 1fr;
  align-items:end;
  gap:6px;
}

.time-field{
  display:block;
}

.time-field span{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.time-input{
  width:100%;
  height:48px;
  border:1px solid #d1d5db;
  border-radius:12px;
  background:white;
  padding:0 8px;
  font-size:20px;
  font-weight:700;
  text-align:center;
}

.time-input:focus{
  outline:2px solid #dbeafe;
  border-color:#93c5fd;
}

.time-arrow{
  text-align:center;
  font-size:20px;
  color:var(--muted);
  padding-bottom:12px;
}

.duration-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  padding:10px 12px;
  background:white;
  border-radius:11px;
  border:1px solid var(--line);
}

.duration-label{
  font-size:12px;
  color:var(--muted);
}

.duration-value{
  font-size:18px;
  font-weight:750;
}

.quick-title{
  font-size:12px;
  color:var(--muted);
  margin-top:12px;
  margin-bottom:6px;
}

.quick-times{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.quick-times button{
  height:36px;
  border:1px solid var(--line);
  background:white;
  border-radius:9px;
  font-size:12px;
  font-weight:650;
}

.quick-times button:active{
  background:#eef0f3;
}

.time-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.time-actions button{
  font-size:12px;
}

/* =========================
   カテゴリ選択
   ========================= */

.category-editor{
  margin-top:12px;
  padding:14px;
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
}

.category-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.category-title strong{
  font-size:15px;
}

.category-state{
  font-size:11px;
  color:var(--muted);
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.cat{
  min-height:48px;
  border:1px solid var(--line);
  background:white;
  border-radius:11px;
  padding:8px 5px;
  text-align:center;
  font-size:12px;
  font-weight:650;
}

.cat:active{
  background:#eef0f3;
}

.cat.fixed{
  border-style:dashed;
}

.category-disabled{
  opacity:.45;
  pointer-events:none;
}

.selected-time{
  margin-bottom:10px;
  padding:9px 11px;
  background:#f3f4f6;
  border-radius:10px;
  font-size:13px;
  text-align:center;
}

/* =========================
   ボタン
   ========================= */

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.actions button,
.primary,
.dangerbtn,
.secondary{
  border:0;
  border-radius:12px;
  height:44px;
  font-weight:700;
}

.primary{
  background:#111827;
  color:white;
  width:100%;
}

.secondary{
  background:#eef0f3;
  color:#111827;
  width:100%;
}

.dangerbtn{
  background:#fee2e2;
  color:#991b1b;
  width:100%;
}

.error{
  color:var(--danger);
  font-size:13px;
  font-weight:650;
  margin-top:8px;
}

.success{
  color:var(--ok);
  font-size:13px;
  font-weight:650;
  margin-top:8px;
}

.notice{
  font-size:13px;
  padding:10px;
  border-radius:12px;
  background:#fff7ed;
  color:#9a3412;
  margin-top:10px;
}

/* =========================
   タイムライン
   ========================= */

.timeline{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.row{
  display:grid;
  grid-template-columns:86px 1fr 52px;
  gap:8px;
  align-items:center;
  font-size:13px;
}

.bar{
  height:30px;
  border-radius:8px;
  background:#eef0f3;
  position:relative;
  overflow:hidden;
}

.seg{
  height:100%;
  position:absolute;
  border-radius:7px;
  display:flex;
  align-items:center;
  padding:0 8px;
  white-space:nowrap;
  overflow:hidden;
  font-size:11px;
  font-weight:650;
}

.sum{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.sum span{
  font-size:12px;
  background:#f3f4f6;
  border-radius:999px;
  padding:5px 8px;
}

/* =========================
   下部ナビ
   ========================= */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  padding:8px max(12px,calc((100vw - 560px)/2 + 12px));
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  z-index:10;
}

.bottom button{
  border:0;
  background:transparent;
  color:#6b7280;
  padding:7px 0;
  font-size:11px;
}

.bottom button.active{
  color:#111827;
  font-weight:750;
}

.bottom .ico{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

/* =========================
   データ
   ========================= */

input[type=text]{
  width:100%;
  height:42px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 11px;
  font-size:15px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 11px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.help{
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="title">24h Activity Log</div>
  <div class="sub">予定と行動を分離して記録する個人用ログ</div>

  <div class="datebar">
    <button id="prev">‹</button>
    <input id="date" type="date">
    <button id="next">›</button>
  </div>
</header>

<main>

<!-- =========================
     HOME
     ========================= -->

<section id="home" class="screen active">

  <div class="card">

    <div class="status">
      <b>ホーム</b>
      <span id="homeStatus" class="pill">未確定</span>
    </div>

    <div class="switch">
      <button id="homeSchedule" class="active">予定</button>
      <button id="homeActivity">行動</button>
    </div>

    <div class="clockwrap">
      <div id="homeClock" class="clock"></div>
    </div>

    <!-- 追加：カテゴリ凡例 -->
    <div id="homeLegend" class="legend"></div>

    <div class="hint">
      選択日の24時間を可視化
    </div>

  </div>

  <div class="card">
    <b>タイムライン</b>

    <div
      id="homeTimeline"
      class="timeline"
      style="margin-top:10px">
    </div>

    <div id="homeSummary" class="sum"></div>
  </div>

</section>


<!-- =========================
     RECORD
     ========================= -->

<section id="record" class="screen">

  <div class="card">

    <div class="status">
      <b>記録</b>

      <span id="recordStatus" class="pill">
        予定：未確定　行動：未確定
      </span>
    </div>

    <div class="switch">
      <button id="recSchedule" class="active">予定</button>
      <button id="recActivity">行動</button>
    </div>


    <!-- 時計は完全に表示専用 -->

    <div class="clockwrap">
      <div id="recordClock" class="clock"></div>
    </div>

    <!-- 追加：カテゴリ凡例 -->
    <div id="recordLegend" class="legend"></div>

    <div class="hint">
      円グラフは表示専用です．時間は下から設定します
    </div>


    <!-- =========================
         時間設定
         ========================= -->

    <div class="time-editor">

      <div class="time-editor-title">
        ① 時間を設定
      </div>

      <div class="time-row">

        <label class="time-field">
          <span>開始</span>

          <input
            id="startTime"
            class="time-input"
            type="time"
            step="900">
        </label>

        <div class="time-arrow">
          →
        </div>

        <label class="time-field">
          <span>終了</span>

          <input
            id="endTime"
            class="time-input"
            type="time"
            step="60">
        </label>

      </div>


      <div class="duration-box">

        <span class="duration-label">
          記録時間
        </span>

        <strong
          id="selectedDuration"
          class="duration-value">
          未設定
        </strong>

      </div>


      <div class="quick-title">
        よく使う時間
      </div>

      <div class="quick-times">

        <button data-duration="15">
          15分
        </button>

        <button data-duration="30">
          30分
        </button>

        <button data-duration="60">
          1時間
        </button>

        <button data-duration="120">
          2時間
        </button>

      </div>


      <div class="time-actions">

        <button
          class="secondary"
          id="setNowStartBtn">
          現在時刻を開始に
        </button>

        <!-- 追加：現在時刻を終了に -->
        <button
          class="secondary"
          id="setNowEndBtn">
          現在時刻を終了に
        </button>

      </div>


      <div class="actions">

        <button
          class="primary"
          id="setTimeBtn">
          時間を決定
        </button>

        <button
          class="secondary"
          id="nowBtn">
          現在時刻から30分
        </button>

      </div>


      <div id="timeError"></div>

    </div>


    <!-- =========================
         カテゴリ選択
         ========================= -->

    <div class="category-editor">

      <div class="category-title">

        <strong>
          ② カテゴリを選択
        </strong>

        <span
          id="categoryState"
          class="category-state">
          時間未設定
        </span>

      </div>

      <div
        id="selectedTime"
        class="selected-time">
        先に時間を設定してください
      </div>

      <div
        id="recordCategoryGrid"
        class="category-grid category-disabled">
      </div>

    </div>


    <div class="actions">

      <button
        class="secondary"
        id="clearBtn">
        編集中をクリア
      </button>

      <button
        class="secondary"
        id="reviseBtn">
        修正
      </button>

    </div>


    <div id="validation"></div>


    <div class="actions">

      <button
        class="primary"
        id="confirmBtn">
        予定を確定
      </button>

    </div>

  </div>


  <div class="card">

    <b>現在の入力</b>

    <div
      id="recordTimeline"
      class="timeline"
      style="margin-top:10px">
    </div>

  </div>

</section>


<!-- =========================
     DATA
     ========================= -->

<section id="data" class="screen">

  <div class="card">

    <b>データエクスポート</b>

    <p class="help">
      確定済みデータをMarkdownとして出力できます．
      Notionへの送信はこの画面から将来接続します．
    </p>

    <div class="actions">

      <button
        class="primary"
        id="exportSchedule">
        予定MD
      </button>

      <button
        class="primary"
        id="exportActivity">
        行動MD
      </button>

    </div>

    <div class="actions">

      <button
        class="secondary"
        id="exportJson">
        JSONバックアップ
      </button>

      <button
        class="secondary"
        id="copyMd">
        Markdownをコピー
      </button>

    </div>

    <div id="exportMsg"></div>

  </div>


  <div class="card">

    <b>カテゴリ管理</b>

    <div
      class="help"
      style="margin:6px 0 10px">
      睡眠・食事・入浴は固定カテゴリです．
      その他は自由に追加できます．
    </div>

    <div class="actions">

      <input
        id="newCat"
        type="text"
        placeholder="カテゴリ名">

      <button
        class="primary"
        id="addCat">
        カテゴリ追加
      </button>

    </div>

    <div
      id="catList"
      class="list"
      style="margin-top:10px">
    </div>

  </div>

</section>

</main>


<!-- =========================
     NAV
     ========================= -->

<nav class="bottom">

  <button
    class="active"
    data-screen="home">

    <span class="ico">⌂</span>
    ホーム

  </button>

  <button
    data-screen="record">

    <span class="ico">＋</span>
    記録

  </button>

  <button
    data-screen="data">

    <span class="ico">☷</span>
    データ

  </button>

</nav>

</div>


<script>

const FIXED = [
  "睡眠",
  "食事",
  "入浴"
];

const KEY =
  "activity_logger_v1";


let db =
  JSON.parse(
    localStorage.getItem(KEY) || "null"
  ) ||
  {
    categories:[
      ...FIXED,
      "研究",
      "就活",
      "大学",
      "趣味",
      "運動",
      "移動",
      "休憩",
      "家事",
      "バイト",
      "その他"
    ],
    days:{}
  };


/* =========================
   日付
   ========================= */

function localDateString(
  d=new Date()
){

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


let dateEl =
  document.getElementById(
    "date"
  );

let selectedDate =
  localDateString();

dateEl.value =
  selectedDate;


/* =========================
   状態
   ========================= */

let mode =
  "schedule";

let homeMode =
  "schedule";

let pending =
  null;


/* =========================
   基本関数
   ========================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

}


function day(){

  if(
    !db.days[selectedDate]
  ){

    db.days[selectedDate] = {

      schedule:[],
      activity:[],

      confirmed:{
        schedule:false,
        activity:false
      },

      md:{
        schedule:"",
        activity:""
      }

    };

  }

  return db.days[selectedDate];

}


function mins(t){

  let [
    h,
    m
  ] =
    t.split(":").map(Number);

  return h*60+m;

}


function hh(m){

  m =
    (
      (m%1440)+1440
    )%1440;

  return (
    String(
      Math.floor(m/60)
    ).padStart(2,"0")
    +
    ":"
    +
    String(
      m%60
    ).padStart(2,"0")
  );

}


function dur(a,b){

  return b>=a
    ? b-a
    : 1440-a+b;

}


function esc(s){

  return s
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    );

}


function fmtDur(x){

  return (
    `${Math.floor(x/60)}:` +
    `${String(x%60).padStart(2,"0")}`
  );

}


function records(
  which=mode
){

  return day()[which] || [];

}


/* =========================
   カテゴリカラー
   ========================= */

function categoryColor(
  category
){

  const index =
    db.categories.indexOf(
      category
    );

  if(index<0){

    return "#d1d5db";

  }

  return `
    hsl(
      ${(index*47)%360}
      62%
      58%
    )
  `;

}


/* =========================
   カテゴリ凡例
   ========================= */

function renderLegend(){

  const targets = [

    {
      id:"homeLegend",
      list:
        db.days[selectedDate]?.[
          homeMode
        ] || []
    },

    {
      id:"recordLegend",
      list:
        records(mode)
    }

  ];


  targets.forEach(
    ({id,list})=>{

      const el =
        document.getElementById(
          id
        );

      if(!el){

        return;

      }


      /*
       * その日の記録に存在するカテゴリだけを表示．
       * 記録がないカテゴリまで大量に表示しない．
       */
      const used =
        [];

      list.forEach(
        x=>{

          if(
            !used.includes(
              x.category
            )
          ){

            used.push(
              x.category
            );

          }

        }
      );


      if(!used.length){

        el.innerHTML = "";

        return;

      }


      el.innerHTML =
        used
          .map(
            category=>
              `
              <div class="legend-item">

                <span
                  class="legend-color"
                  style="
                    background:${categoryColor(
                      category
                    )}
                  ">
                </span>

                <span>
                  ${esc(category)}
                </span>

              </div>
              `
          )
          .join("");

    }
  );

}


/* =========================

  return Math.floor(m/15)*15;

}

  const end =

      "endTime"

/* =========================
   重複処理
   ========================= */

function overlaps(
  list,
  s,
  e
){

  const a =
    mins(s);

  const b =
    mins(e);


  return list.some(
    x=>{

      const xs =
        mins(x.start);

      const xe =
        mins(x.end);


      const newIntervals =
        b>a
          ? [[a,b]]
          : [
              [a,1440],
              [0,b]
            ];


      const oldIntervals =
        xe>xs
          ? [[xs,xe]]
          : [
              [xs,1440],
              [0,xe]
            ];


      return newIntervals.some(
        ([na,nb])=>
          oldIntervals.some(
            ([oa,ob])=>
              na<ob &&
              nb>oa
          )
      );

    }
  );

}


/* =========================
   記録追加
   ========================= */

function addRecord(
  start,
  end,
  category,
  which=mode
){

  if(
    start===end
  ){

    alert(
      "開始時刻と終了時刻が同じです．"
    );

    return;

  }


  let list =
    records(which);


  if(
    overlaps(
      list,
      start,
      end
    )
  ){

    if(
      !confirm(
        "既存の記録と重複しています．\n" +
        "重複部分は上書きされますがよろしいですか？"
      )
    ){

      return;

    }

  }


  const ns =
    mins(start);

  const ne =
    mins(end);


  const intervals =
    ne>ns
      ? [[ns,ne]]
      : [
          [ns,1440],
          [0,ne]
        ];


  let out=[];


  for(
    const x of list
  ){

    const xs =
      mins(x.start);

    const xe =
      mins(x.end);


    const xints =
      xe>xs
        ? [[xs,xe]]
        : [
            [xs,1440],
            [0,xe]
          ];


    for(
      const [xa,xb]
      of xints
    ){

      let pieces =
        [[xa,xb]];


      for(
        const [oa,ob]
        of intervals
      ){

        let next=[];


        for(
          const [pa,pb]
          of pieces
        ){

          if(
            pb<=oa ||
            pa>=ob
          ){

            next.push(
              [pa,pb]
            );

          }else{

            if(pa<oa){

              next.push(
                [pa,oa]
              );

            }

            if(pb>ob){

              next.push(
                [ob,pb]
              );

            }

          }

        }


        pieces =
          next;

      }


      for(
        const [pa,pb]
        of pieces
      ){

        if(
          pb>pa
        ){

          out.push({

            start:
              hh(pa),

            end:
              hh(pb),

            category:
              x.category

          });

        }

      }

    }

  }


  for(
    const [a,b]
    of intervals
  ){

    if(
      b>a
    ){

      out.push({

        start:
          hh(a),

        end:
          hh(b),

        category

      });

    }

  }


  out.sort(
    (a,b)=>
      mins(a.start)
      -
      mins(b.start)
  );


  day()[which] =
    out;


  save();

  clearTimeEditor();

  render();

}


/* =========================
   時計描画
   ========================= */

function svgClock(
  list
){

  const size =
    340;

  const c =
    170;

  const R =
    150;

  const inner =
    112;


  const palette = {};


  db.categories.forEach(
    (x,i)=>
      palette[x] =
        categoryColor(x)
  );


  const polar =
    (m,r=R)=>{

      const ang =
        (m/1440)
        *
        Math.PI*2
        -
        Math.PI/2;


      return [

        c+
        r*
        Math.cos(ang),

        c+
        r*
        Math.sin(ang)

      ];

    };


  const arc =
    (
      s,
      e,
      r1=inner,
      r2=R
    )=>{

      let a =
        s;

      let b =
        e;


      if(
        b<=a
      ){

        b+=1440;

      }


      const span =
        b-a;


      const large =
        span>720
          ? 1
          : 0;


      const p1 =
        polar(
          a%1440,
          r2
        );

      const p2 =
        polar(
          b%1440,
          r2
        );

      const q2 =
        polar(
          b%1440,
          r1
        );

      const q1 =
        polar(
          a%1440,
          r1
        );


      const record =
        list.find(
          x=>
            mins(x.start)
            ===
            a%1440
        );


      const category =
        record
          ? record.category
          : null;


      return `

        <path
          d="
            M ${p1}
            A ${r2} ${r2}
              0 ${large} 1 ${p2}
            L ${q2}
            A ${r1} ${r1}
              0 ${large} 0 ${q1}
            Z
          "
          fill="${
            palette[category]
            ||
            "#d1d5db"
          }"
          opacity=".86"
        />

      `;

    };


  let parts=[];


  for(
    let i=0;
    i<24;
    i++
  ){

    const p =
      polar(
        i*60,
        R+1
      );

    const q =
      polar(
        i*60,
        R+10
      );


    parts.push(`

      <line
        x1="${p[0]}"
        y1="${p[1]}"
        x2="${q[0]}"
        y2="${q[1]}"
        stroke="#9ca3af"
        stroke-width="${
          i%6===0
            ? 2
            : 1
        }"
      />

    `);

  }


  for(
    const x of list
  ){

    parts.push(
      arc(
        mins(x.start),
        mins(x.end)
      )
    );

  }


  for(
    let i=0;
    i<24;
    i+=3
  ){

    const p =
      polar(
        i*60,
        inner-16
      );


    parts.push(`

      <text
        x="${p[0]}"
        y="${p[1]+4}"
        text-anchor="middle">

        ${i}

      </text>

    `);

  }


  return `

    <svg
      viewBox="0 0 ${size} ${size}"
      aria-label="24時間グラフ">

      <circle
        cx="${c}"
        cy="${c}"
        r="${R}"
        fill="#fafafa"
        stroke="#e5e7eb"
      />

      ${parts.join("")}

      <circle
        class="center"
        cx="${c}"
        cy="${c}"
        r="${inner}"
      />

      <text
        x="${c}"
        y="${c-5}"
        text-anchor="middle"
        style="
          font-size:20px;
          fill:#111827;
          font-weight:700;
        ">

        ${selectedDate
          .slice(5)
          .replace("-","/")}

      </text>

      <text
        x="${c}"
        y="${c+17}"
        text-anchor="middle">

        ${
          list.reduce(
            (s,x)=>
              s+
              dur(
                mins(x.start),
                mins(x.end)
              ),
            0
          )===1440
            ? "24:00"
            : "記録"
        }

      </text>

    </svg>

  `;

}


function renderClock(){

  document.getElementById(
    "homeClock"
  ).innerHTML =
    svgClock(
      db.days[selectedDate]?.[
        homeMode
      ] || []
    );


  document.getElementById(

/* =========================
   タイムライン
   ========================= */

function timelineHTML(
  list
){

  if(
    !list.length
  ){

    return `
      <div class="small">
        まだ記録がありません．
      </div>
    `;

  }


  let rows =
    list
      .map(
        x=>{

          const d =
            dur(
              mins(x.start),
              mins(x.end)
            );


          const left =
            mins(x.start)
            /
            1440
            *
            100;


          const width =
            d
            /
            1440
            *
            100;


          return `

            <div class="row">

              <div>
                ${x.start}–${x.end}
              </div>

              <div class="bar">

                <div
                  class="seg"
                  style="
                    left:${left}%;
                    width:${Math.max(
                      width,
                      .8
                    )}%;
                    background:${categoryColor(
                      x.category
                    )}
                  ">

                  ${esc(x.category)}

                </div>

              </div>

              <div>
                ${fmtDur(d)}
              </div>

            </div>

          `;

        }
      )
      .join("");


  let sums={};


  list.forEach(
    x=>{

      sums[x.category] =
        (
          sums[x.category]
          ||
          0
        )
        +
        dur(
          mins(x.start),
          mins(x.end)
        );

    }
  );


  let sum =
    Object.entries(sums)
      .sort(
        (a,b)=>
          b[1]-a[1]
      )
      .map(
        ([k,v])=>
          `
          <span>
            ${esc(k)}
            ${fmtDur(v)}
          </span>
          `
      )
      .join("");


  return (
    rows+
    `<div class="sum">${sum}</div>`
  );

}

/* =========================
   Validation
   ========================= */

function validate(
  which=mode
){

  let r =
    records(which);

  let total=0;


  r.forEach(
    x=>{

      total +=
        dur(
          mins(x.start),
          mins(x.end)
        );

    }
  );


  let missing =
    1440-total;


  let el =
    document.getElementById(
      "validation"
    );


  el.innerHTML =
    missing>0

      ? `
        <div class="error">
          ⚠ 未記録時間があります：
          ${fmtDur(missing)}
          （${fmtDur(total)}/24:00）
        </div>
        `

      : `
        <div class="success">
          24時間すべて記録されています．
        </div>
        `;


  return {
    total,
    missing
  };

}

/* =========================
   Download
   ========================= */

function download(
  name,
  text,
  type="text/markdown"
){

  let a =
    document.createElement(
      "a"
    );


  a.href =
    URL.createObjectURL(
      new Blob(
        [text],
        {type}
      )
    );


  a.download =
    name;


  a.click();


  setTimeout(
    ()=>
      URL.revokeObjectURL(
        a.href
      ),
    1000
  );

}

          document.getElementById(
            "startTime"
          ).value =
            start;

        }


        const end =
          (
            mins(start)
            +
            duration
          )
          %
          1440;


        document.getElementById(
          "endTime"
        ).value =
          hh(end);


        updateDuration();

        updateCategoryState();

      };

    }
  );


/* =========================
   Current Time
   ========================= */

document.getElementById(
  "setNowStartBtn"
).onclick=()=>{

  setCurrentStart();

};


/*
 * 追加：
 * 現在時刻を終了に設定
 */
document.getElementById(
  "setNowEndBtn"
).onclick=()=>{

  setCurrentEnd();

};


document.getElementById(
  "nowBtn"
).onclick=()=>{

  setNow30();

};


/* =========================
   Time Confirm
   ========================= */

document.getElementById(
  "setTimeBtn"
).onclick=()=>{

  if(
    !validateTimeInput()
  ){

    return;

  }


  updateDuration();

  updateCategoryState();


  document
    .getElementById(
      "recordCategoryGrid"
    )
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

};


/* =========================
   Clear
   ========================= */

document.getElementById(
  "clearBtn"
).onclick=()=>{

  clearTimeEditor();

};


/* =========================
   Confirm
   ========================= */

document.getElementById(
  "confirmBtn"
).onclick=()=>{

  let v =
    validate(mode);


  let label =
    mode==="schedule"
      ? "予定"
      : "行動";


  if(
    v.missing>0 &&
    !confirm(
      `24時間に${fmtDur(
        v.missing
      )}の未記録時間があります．このまま${label}を確定しますか？`
    )
  ){

    return;

  }


  day().confirmed[mode] =
    true;


  day().md[mode] =
    md(mode);


  save();

  render();


  alert(
    `${label}を確定しました．`
  );

};


/* =========================
   Revise
   ========================= */

document.getElementById(
  "reviseBtn"
).onclick=()=>{

  let what =
    prompt(
      "修正するデータを入力してください：予定 / 行動",
      mode==="schedule"
        ? "予定"
        : "行動"
    );


  if(
    what==="予定"
  ){

    day().confirmed.schedule =
      false;

    mode =
      "schedule";

  }

  else if(
    what==="行動"
  ){

    day().confirmed.activity =
      false;

    mode =
      "activity";

  }

  else{

    return;

  }


  save();

  render();

};


/* =========================
   Export
   ========================= */

document.getElementById(
  "exportSchedule"
).onclick=()=>{

  if(
    !day().confirmed.schedule
  ){

    alert(
      "予定が確定されていません．"
    );

    return;

  }


  download(
    `schedule_${selectedDate}.md`,
    day().md.schedule
      ||
      md("schedule")
  );

};


document.getElementById(
  "exportActivity"
).onclick=()=>{

  if(
    !day().confirmed.activity
  ){

    alert(
      "行動が確定されていません．"
    );

    return;

  }


  download(
    `activity_${selectedDate}.md`,
    day().md.activity
      ||
      md("activity")
  );

};


document.getElementById(
  "exportJson"
).onclick=()=>{

  download(
    `activity_${selectedDate}.json`,
    JSON.stringify(
      day(),
      null,
      2
    ),
    "application/json"
  );

};


document.getElementById(
  "copyMd"
).onclick=async()=>{

  let t =
    md(mode);


  try{

    await navigator.clipboard.writeText(t);


    document.getElementById(
      "exportMsg"
    ).innerHTML =
      `
      <div class="success">
        Markdownをコピーしました．
      </div>
      `;

  }catch(e){

    document.getElementById(
      "exportMsg"
    ).innerHTML =
      `
      <div class="error">
        コピーに失敗しました．
        Markdown出力を利用してください．
      </div>
      `;

  }

};


/* =========================
   Add Category
   ========================= */

document.getElementById(
  "addCat"
).onclick=()=>{

  let v =
    document.getElementById(
      "newCat"
    ).value.trim();


  if(!v){

    return;

  }


  if(
    !db.categories.includes(v)
  ){

    db.categories.push(v);

  }


  document.getElementById(
    "newCat"
  ).value="";


  save();

  render();

};


/* =========================
   初期化
   ========================= */

render();


if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker
    .register("sw.js")
    .catch(
      ()=>{}
    );

}

</script>

</body>
</html>
