<script>

/* =========================================================
   基本設定
========================================================= */

const FIXED = [
  "睡眠",
  "食事",
  "入浴"
];

const KEY = "activity_logger_v1";


let db =
  JSON.parse(
    localStorage.getItem(KEY) || "null"
  )
  ||
  {
    categories:[
      ...FIXED,
      "研究",
      "就活",
      "大学",
      "趣味",
      "運動",
      "移動",
      "休憩",
      "家事",
      "バイト",
      "その他"
    ],
    days:{}
  };


let dateEl =
  document.getElementById("date");


let selectedDate =
  new Date()
    .toISOString()
    .slice(0,10);


dateEl.value =
  selectedDate;


let mode =
  "schedule";


let homeMode =
  "schedule";


let pending =
  null;


/* =========================================================
   カテゴリカラー
========================================================= */

function categoryColor(category){

  const index =
    db.categories.indexOf(category);

  if(index < 0){
    return "#d1d5db";
  }

  return `hsl(${(index * 47) % 360} 62% 58%)`;
}


/* =========================================================
   保存
========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

}


/* =========================================================
   日付データ
========================================================= */

function day(){

  if(!db.days[selectedDate]){

    db.days[selectedDate] = {

      schedule:[],
      activity:[],

      confirmed:{
        schedule:false,
        activity:false
      },

      md:{
        schedule:"",
        activity:""
      }

    };

  }

  return db.days[selectedDate];

}


/* =========================================================
   時間関連
========================================================= */

function mins(t){

  let [h,m] =
    t.split(":").map(Number);

  return h * 60 + m;

}


function hh(m){

  m =
    ((m % 1440) + 1440) % 1440;

  return (
    String(
      Math.floor(m / 60)
    ).padStart(2,"0")
    +
    ":"
    +
    String(m % 60).padStart(2,"0")
  );

}


function dur(a,b){

  return b >= a
    ? b - a
    : 1440 - a + b;

}


function fmtDur(x){

  return (
    `${Math.floor(x / 60)}:` +
    `${String(x % 60).padStart(2,"0")}`
  );

}


function esc(s){

  return s
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


function records(which=mode){

  return day()[which] || [];

}


/* =========================================================
   バリデーション
========================================================= */

function validate(which=mode){

  let r =
    records(which);

  let total = 0;

  r.forEach(
    x =>
      total +=
        dur(
          mins(x.start),
          mins(x.end)
        )
  );

  let missing =
    1440 - total;


  let el =
    document.getElementById(
      "validation"
    );


  el.innerHTML =
    missing > 0

      ?

      `<div class="error">
        ⚠ 未記録時間があります：
        ${fmtDur(missing)}
        （${fmtDur(total)}/24:00）
      </div>`

      :

      `<div class="success">
        24時間すべて記録されています．
      </div>`;


  return {
    total,
    missing
  };

}


/* =========================================================
   重複チェック
========================================================= */

function overlaps(list,s,e){

  const a =
    mins(s);

  const b =
    mins(e);


  return list.some(x=>{

    const xs =
      mins(x.start);

    const xe =
      mins(x.end);


    if(b > a){

      return (
        xs < b &&
        xe > a
      );

    }


    return (
      (xs < 1440 && xe > a)
      ||
      (xs < b && xe > 0)
      ||
      (xs === 0 && xe === 1440)
    );

  });

}


/* =========================================================
   記録追加
========================================================= */

function addRecord(
  start,
  end,
  category,
  which=mode
){

  if(start === end){

    alert(
      "開始時刻と終了時刻が同じです．"
    );

    return;

  }


  let list =
    records(which);


  if(
    overlaps(
      list,
      start,
      end
    )
    &&
    !confirm(
      "既存の記録と重複しています．" +
      "重複部分は上書きされますがよろしいですか？"
    )
  ){

    return;

  }


  let ns =
    mins(start);

  let ne =
    mins(end);


  let intervals =
    ne > ns

      ? [[ns,ne]]

      : [
          [ns,1440],
          [0,ne]
        ];


  let out = [];


  for(const x of list){

    let xs =
      mins(x.start);

    let xe =
      mins(x.end);


    let xints =
      xe > xs

        ? [[xs,xe]]

        : [
            [xs,1440],
            [0,xe]
          ];


    for(
      const [xa,xb]
      of xints
    ){

      let pieces =
        [[xa,xb]];


      for(
        const [oa,ob]
        of intervals
      ){

        let next = [];


        for(
          const [pa,pb]
          of pieces
        ){

          if(
            pb <= oa ||
            pa >= ob
          ){

            next.push(
              [pa,pb]
            );

          }

          else{

            if(pa < oa){

              next.push(
                [pa,oa]
              );

            }


            if(pb > ob){

              next.push(
                [ob,pb]
              );

            }

          }

        }


        pieces =
          next;

      }


      for(
        const [pa,pb]
        of pieces
      ){

        if(pb > pa){

          out.push({

            start:hh(pa),
            end:hh(pb),
            category:x.category

          });

        }

      }

    }

  }


  for(
    const [a,b]
    of intervals
  ){

    if(b > a){

      out.push({

        start:hh(a),
        end:hh(b),
        category

      });

    }

  }


  out.sort(
    (a,b)=>
      mins(a.start)
      -
      mins(b.start)
  );


  day()[which] =
    out;


  save();
  render();

}


/* =========================================================
   円グラフ
========================================================= */

function svgClock(list){

  const size =
    340;

  const c =
    170;

  const R =
    150;

  const inner =
    112;


  const polar =
    (m,r=R)=>{

      let ang =
        (m / 1440)
        *
        Math.PI * 2
        -
        Math.PI / 2;


      return [

        c +
        r *
        Math.cos(ang),

        c +
        r *
        Math.sin(ang)

      ];

    };


  const arc =
    (
      s,
      e,
      r1=inner,
      r2=R
    )=>{

      let a =
        s;

      let b =
        e;


      if(b <= a){

        b += 1440;

      }


      let span =
        b - a;


      let large =
        span > 720
          ? 1
          : 0;


      let p1 =
        polar(
          a % 1440,
          r2
        );


      let p2 =
        polar(
          b % 1440,
          r2
        );


      let q2 =
        polar(
          b % 1440,
          r1
        );


      let q1 =
        polar(
          a % 1440,
          r1
        );


      let rec =
        list.find(
          x =>
            mins(x.start)
            ===
            a % 1440
        );


      let color =
        rec
          ? categoryColor(
              rec.category
            )
          : "#d1d5db";


      return `

        <path

          d="
            M ${p1[0]} ${p1[1]}

            A ${r2} ${r2}
              0 ${large} 1
              ${p2[0]} ${p2[1]}

            L ${q2[0]} ${q2[1]}

            A ${r1} ${r1}
              0 ${large} 0
              ${q1[0]} ${q1[1]}

            Z
          "

          fill="${color}"
          opacity=".86"

        />

      `;

    };


  let parts = [];


  /* 1時間ごとの目盛線 */

  for(
    let i=0;
    i<24;
    i++
  ){

    let p =
      polar(
        i * 60,
        R + 1
      );


    let q =
      polar(
        i * 60,
        R + 10
      );


    parts.push(`

      <line

        x1="${p[0]}"
        y1="${p[1]}"

        x2="${q[0]}"
        y2="${q[1]}"

        stroke="#9ca3af"

        stroke-width="${
          i % 6 === 0
            ? 2
            : 1
        }"

      />

    `);

  }


  /* 記録済み時間 */

  for(
    const x
    of list
  ){

    parts.push(
      arc(
        mins(x.start),
        mins(x.end)
      )
    );

  }


  /* 3時間ごとの時間表示 */

  for(
    let i=0;
    i<24;
    i+=3
  ){

    let p =
      polar(
        i * 60,
        R + 22
      );


    parts.push(`

      <text

        x="${p[0]}"
        y="${p[1] + 4}"

        text-anchor="middle"

        style="
          font-size:13px;
          fill:#374151;
          font-weight:650;
        "

      >

        ${i}:00

      </text>

    `);

  }


  /* 合計時間 */

  let totalMinutes =
    list.reduce(
      (s,x)=>
        s +
        dur(
          mins(x.start),
          mins(x.end)
        ),
      0
    );


  return `

    <svg
      viewBox="0 0 ${size} ${size}"
      aria-label="24時間グラフ"
    >

      <circle
        cx="${c}"
        cy="${c}"
        r="${R}"
        fill="#fafafa"
        stroke="#e5e7eb"
      />

      ${parts.join("")}

      <circle
        class="center"
        cx="${c}"
        cy="${c}"
        r="${inner}"
      />

      <text
        x="${c}"
        y="${c-5}"
        text-anchor="middle"
        style="
          font-size:20px;
          fill:#111827;
          font-weight:700;
        "
      >

        ${selectedDate
          .slice(5)
          .replace("-","/")}

      </text>


      <text
        x="${c}"
        y="${c+17}"
        text-anchor="middle"
        style="
          font-size:13px;
          fill:#6b7280;
        "
      >

        ${fmtDur(totalMinutes)}

      </text>

    </svg>

  `;

}

function timelineHTML(list){

  if(!list.length){

    return `
      <div class="small">
        まだ記録がありません．
      </div>
    `;

  }


  let rows =
    list
      .map(
        x => {

          const d =
            dur(
              mins(x.start),
              mins(x.end)
            );


          const left =
            mins(x.start)
            /
            1440
            *
            100;


          const width =
            d
            /
            1440
            *
            100;


          return `

            <div class="row">

              <div>
                ${x.start}–${x.end}
              </div>

              <div class="bar">

                <div
                  class="seg"

                  style="
                    left:${left}%;
                    width:${Math.max(width,.8)}%;
                    background:${categoryColor(x.category)};
                  "
                >

                  ${esc(x.category)}

                </div>

              </div>

              <div>
                ${fmtDur(d)}
              </div>

            </div>

          `;

        }
      )
      .join("");


  let sums = {};


  list.forEach(
    x =>
      sums[x.category] =
        (
          sums[x.category]
          ||
          0
        )
        +
        dur(
          mins(x.start),
          mins(x.end)
        )
  );


  let sum =
    Object.entries(sums)
      .sort(
        (a,b)=>
          b[1]-a[1]
      )
      .map(
        ([k,v])=>
          `<span>
            ${esc(k)}
            ${fmtDur(v)}
          </span>`
      )
      .join("");


  return (
    rows
    +
    `<div class="sum">
      ${sum}
    </div>`
  );

}

/* =========================================================
   ドラッグ操作
========================================================= */

function attachDrag(el){

  let start =
    null;


  const pointToMin =
    e => {

      const r =
        el.getBoundingClientRect();


      const x =
        e.clientX
        -
        r.left
        -
        r.width / 2;


      const y =
        e.clientY
        -
        r.top
        -
        r.height / 2;


      let a =
        Math.atan2(y,x)
        +
        Math.PI / 2;


      if(a < 0){

        a +=
          Math.PI * 2;

      }


      return (
        Math.round(
          (
            a
            /
            (Math.PI * 2)
            *
            1440
          )
          /
          5
        )
        *
        5
      )
      % 1440;

    };


  el.onpointerdown =
    e => {

      if(
        !document
          .getElementById("record")
          .classList
          .contains("active")
      ){

        return;

      }


      start =
        pointToMin(e);


      el.setPointerCapture(
        e.pointerId
      );

    };


  el.onpointerup =
    e => {

      if(start === null){

        return;

      }


      let end =
        pointToMin(e);


      if(end === start){

        end =
          (start + 30)
          % 1440;

      }


      pending = {

        start:hh(start),
        end:hh(end)

      };


      openCats();


      start =
        null;

    };

}

/* =========================================================

========================================================= */

function md(which){

  let list =
    day()[which];


  let title =
    which === "schedule"
      ? "Schedule"
      : "Activity";


  let sums = {};


  list.forEach(
    x =>
      sums[x.category] =
        (
          sums[x.category]
          ||
          0
        )
        +
        dur(
          mins(x.start),
          mins(x.end)
        )
  );


  return (

    `# ${title} — ${selectedDate}\n\n`
    +
    `## Time Log\n\n`
    +
    `| Start | End | Duration | Category |\n`
    +
    `|---|---|---:|---|\n`
    +
    list
      .map(
        x =>
          `| ${x.start} | ${x.end} | ` +
          `${fmtDur(
            dur(
              mins(x.start),
              mins(x.end)
            )
          )} | ${x.category} |`
      )
      .join("\n")
    +
    `\n\n## Summary\n\n`
    +
    Object.entries(sums)
      .sort(
        (a,b)=>
          b[1]-a[1]
      )
      .map(
        ([k,v]) =>
          `- ${k}：${fmtDur(v)}`
      )
      .join("\n")
    +
    "\n"

  );

}

function download(
  name,
  text,
  type="text/markdown"
){

  let a =
    document.createElement(
      "a"
    );


  a.href =
    URL.createObjectURL(
      new Blob(
        [text],
        {type}
      )
    );


  a.download =
    name;


  a.click();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        a.href
      ),
    1000
  );

}

  "nowBtn"

  () => {

      now.getHours()
      *
      60
      +
      now.getMinutes();


    let list =
      records(mode);


    let last =
      list
        .slice()
        .sort(
          (a,b)=>
            mins(a.end)
            -
            mins(b.end)
        )
        .at(-1);


    if(
      last
      &&
      mins(last.end) !== start
      &&
      mins(last.end) > start
    ){

      start =
        mins(last.end);

    }


    pending = {

      start:hh(start),

      end:hh(
        (start + 30)
        % 1440
      )

    };


    openCats();

/* =========================================================
   現在時刻を終了時間にする
========================================================= */

document.getElementById(
  "nowEndBtn"
).onclick =
  () => {

    let now =
      new Date();


    let end =
      now.getHours()
      *
      60
      +
      now.getMinutes();


    /*
      直前の未確定入力があれば
      その入力の終了時間を
      現在時刻に変更する

      例：
      10:00 → 10:30
      ↓
      現在時刻 10:47
      ↓
      10:00 → 10:47
    */

    if(pending){

      let start =
        mins(
          pending.start
        );


      if(start === end){

        alert(
          "開始時刻と終了時刻が同じです．"
        );

        return;

      }


      pending.end =
        hh(end);


      openCats();

      return;

    }


    /*
      pendingがない場合は，
      最後に記録されている
      区間の終了時間を開始時間として
      現在時刻までを新規入力する
    */

    let list =
      records(mode);


    if(!list.length){

      alert(
        "開始時間が設定されていません．" +
        "先に「現在時刻から記録」または" +
        "円グラフから時間帯を指定してください．"
      );

      return;

    }


    let sorted =
      list
        .slice()
        .sort(
          (a,b)=>
            mins(a.end)
            -
            mins(b.end)
        );


    let last =
      sorted.at(-1);


    let start =
      mins(last.end);


    if(start === end){

      alert(
        "最後の記録の終了時刻と現在時刻が同じです．"
      );

      return;

    }


    pending = {

      start:hh(start),
      end:hh(end)

    };


    openCats();

  };
